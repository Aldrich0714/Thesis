<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adviser Access</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-black text-white font-sans antialiased flex flex-col">
  <header class="sticky top-0 z-50 w-full bg-[#700000] border-b border-red-900/50 py-5 px-3 flex items-center gap-3 shadow-md">
    <a href="signin.html" class="text-white hover:opacity-80 transition">
     <svg xmlns="http://www.w3.org/2000/svg"width="40" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </a>
    <div class="w-13 h-13 ">
  <img src="image/logo.png" alt="User Profile" class="w-full h-full object-cover">
</div>
    <div class="flex flex-col">
      <h2 class="text-[23px] font-serif font-bold text-white leading-none">Adviser Access</h2>
      <p class="text-[13px] text-gray-200/90 font-light mt-1">Secure Role-based Authentication</p>
    </div>
  </header>
  <main 
    class="relative flex-1 w-full bg-cover bg-center flex flex-col items-center justify-center p-6 overflow-hidden"
    style="background-image: url('image/bg.jpg');"
  >
    <div class="absolute inset-0 bg-red-950/20 bg-white/30 pointer-events-none"></div>
    <img 
      src="image/logo.png" 
      alt="Watermark Logo" 
      class="absolute left-6 md:left-16 top-50 -translate-y-1/2 w-72 md:w-[290px] opacity-20 pointer-events-none object-contain"
    />
    <div class="relative z-10 w-full max-w-md bg-red-950/40 backdrop-blur-md border border-white/20 rounded-3xl p-8 flex flex-col items-center shadow-2xl">
      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-red-900 shadow-md mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </div>
      <h1 class="text-[25px] font-bold text-red-950 font-serif mb-8">Sign-up</h1>
      <form class="w-full flex flex-col gap-6"> 
        <div class="w-full">
          <input 
            type="text" 
            placeholder="Name" 
            class="w-full bg-transparent border-b border-white/70 py-2 px-1 text-white placeholder-gray-400 focus:outline-none focus:border-white text-[15px] transition"
          />
        </div>
        <div class="w-full">
          <input 
            type="password" 
            placeholder="Password" 
            class="w-full bg-transparent border-b border-white/70 py-2 px-1 text-white placeholder-gray-400 focus:outline-none focus:border-white text-[15px] transition"
          />
        </div>
        <a 
        href="Adviser.html" 
        class="block text-center w-full mt-4 bg-gradient-to-r from-red-900 to-red-950 hover:from-red-800 hover:to-red-900 text-white font-medium py-3 rounded-xl border border-white/20 shadow-lg transition active:scale-95"
>
  Log-in
</a>
      </form>
    </div>
  </main>
</body>
</html>
