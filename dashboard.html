<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Results - MSEUF Election System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen w-full bg-[#e3dddd] text-gray-800 font-sans antialiased flex flex-col">

 <header class="sticky top-0 z-50 w-full bg-[#700000] border-b border-red-950/50 py-5 px-3 flex items-center gap-3 shadow-md">
  <div class="flex items-center gap-2 sm:gap-3">
    <a href="MSEUF-CI_Election.html" class="text-white hover:opacity-80 transition">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
    </a>

    <div class="w-11 h-11 shrink-0 overflow-hidden rounded-full">
      <img src="image/logo.png" alt="User Profile" class="w-full h-full object-cover">
    </div>

    <h2 class="text-lg sm:text-[22px] font-serif font-bold text-white leading-none">Live Dashboard</h2>
  </div>
</header>
  
  <main class="w-full flex-1 px-6 pt-4 pb-8 md:px-12 md:pt-5 md:pb-10 flex flex-col gap-4">

    <div class="flex items-center justify-between gap-4 border-b border-gray-300 pb-2.5">
      <div class="flex items-center gap-3">
        <h2 class="text-[25px] sm:text-[20px] font-serif font-bold text-gray-950 leading-none">Live Results</h2>
      </div>

      <div class="flex items-center gap-2">
        <label for="sortSelect" class="font-serif font-semibold text-gray-800 text-[20px] sm:text-[15px] leading-none">Sort By:</label>
        <div class="relative flex items-center">
          <select id="sortSelect" class="appearance-none bg-[#d5cece] hover:bg-[#c9c1c1] border border-red-900/40 text-gray-900 font-serif font-medium text-sm sm:text-base rounded-xl py-1 pl-3 pr-8 focus:outline-none focus:ring-2 focus:ring-red-800 cursor-pointer shadow-sm">
            <option value="high-low">Highest to Lowest</option>
            <option value="low-high">Lowest to Highest</option>
          </select>
          <div class="pointer-events-none absolute right-2 flex items-center text-red-900">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  
    <div id="resultsContainer" class="flex flex-col gap-4 w-full">

      <div class="position-section flex flex-col gap-1.5 w-full" data-position="President">
        <div class="border-l-4 border-red-800 pl-2.5">
          <h3 class="text-[25px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">President</h3>
        </div>

        <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
          <!-- Candidate 1 -->
          <div class="candidate-row flex flex-col w-full" data-candidate-id="1">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>

          <div class="mt-2 candidate-row flex flex-col w-full" data-candidate-id="2">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="position-section flex flex-col mt-2 gap-1.5 w-full" data-position="Vice-President">
        <div class="border-l-4 border-red-800 pl-2.5">
          <h3 class="text-[25px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">Vice-President</h3>
        </div>

        <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
        
          <div class="candidate-row flex flex-col w-full" data-candidate-id="3">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>

          
          <div class="candidate-row mt-2 flex flex-col w-full" data-candidate-id="4">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="position-section mt-2 flex flex-col gap-1.5 w-full" data-position="Secretary">
        <div class="border-l-4 border-red-800 pl-2.5">
          <h3 class="text-[25px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">Secretary</h3>
        </div>

        <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
      
          <div class="candidate-row flex flex-col w-full" data-candidate-id="5">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>

          <div class="candidate-row mt-2 flex flex-col w-full" data-candidate-id="6">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>
          <div class="candidate-row mt-2 flex flex-col w-full" data-candidate-id="6">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>
          <div class="candidate-row mt-2 flex flex-col w-full" data-candidate-id="6">
            <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
              <span id="percent">0%</span>
            </div>
            <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
              <div id="bar" class="bg-red-600 h-full rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
