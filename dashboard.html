  <script>
    const STORAGE_KEYS = {
      status: 'election_status',   // 'OPEN' | 'PAUSED' | 'CLOSED'
      masked: 'names_masked'       // 'true' | 'false'
    };
    const MASK_CHAR = '••••••••';
 
    function getElectionStatus() {
      return localStorage.getItem(STORAGE_KEYS.status) || 'OPEN';
    }
 
    function getNamesMasked() {
      const v = localStorage.getItem(STORAGE_KEYS.masked);
      return v === null ? true : v === 'true'; // masked by default
    }
 
    // Names are revealed once the election is CLOSED, or if the admin has
    // manually unmasked them ahead of time.
    function isRevealed() {
      if (getElectionStatus() === 'CLOSED') return true;
      return !getNamesMasked();
    }
 
    function applyState() {
      const status = getElectionStatus();
      const revealed = isRevealed();
 
      const banner = document.getElementById('statusBanner');
      const bannerText = document.getElementById('statusBannerText');
      const statusIcon = document.getElementById('statusIcon');
 
      banner.classList.remove(
        'bg-emerald-100', 'text-emerald-900', 'border-emerald-400',
        'bg-amber-100', 'text-amber-900', 'border-amber-400',
        'bg-gray-200', 'text-gray-800', 'border-gray-400'
      );
 
      if (status === 'CLOSED') {
        bannerText.textContent = 'Election Ended \u2014 Official Results Revealed';
        statusIcon.textContent = '✅';
        banner.classList.add('bg-emerald-100', 'text-emerald-900', 'border-emerald-400');
      } else if (revealed) {
        bannerText.textContent = 'Voting in Progress \u2014 Names Revealed (Preview)';
        statusIcon.textContent = '👁️';
        banner.classList.add('bg-amber-100', 'text-amber-900', 'border-amber-400');
      } else {
        bannerText.textContent = 'Voting in Progress (Names Hidden)';
        statusIcon.textContent = '🔒';
        banner.classList.add('bg-gray-200', 'text-gray-800', 'border-gray-400');
      }
 
      document.querySelectorAll('.candidate-row').forEach((row) => {
        const nameEl = row.querySelector('.candidate-name');
        const realName = row.getAttribute('data-candidate-name');
        if (!nameEl || !realName) return;
        nameEl.textContent = revealed ? realName : MASK_CHAR;
      });
    }
 
    // Fires in OTHER tabs/windows whenever admin-dashboard.html writes to
    // localStorage — this is what gives us the "no refresh needed" sync.
    window.addEventListener('storage', (event) => {
      if (event.key === STORAGE_KEYS.status || event.key === STORAGE_KEYS.masked) {
        applyState();
      }
    });
 
    document.addEventListener('DOMContentLoaded', applyState);
  </script>
