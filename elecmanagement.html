<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Election Management - MSEUF Election System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.2);
    }
  </style>
</head>

<body class="min-h-screen w-full bg-[#8f0000] text-gray-800 font-sans antialiased flex flex-col overflow-y-auto">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 w-full bg-[#8f0000] border-b border-[#710000] py-5 px-3 flex items-center gap-3 shadow-md">
    <div class="flex items-center gap-3">
      <a href="Adviser.html" class="text-[#efefef] hover:opacity-80 transition shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path>
        </svg>
      </a>

      <div class="w-11 h-11 shrink-0 overflow-hidden rounded-full">
        <img src="image/logo.png" alt="User Profile" class="w-full h-full object-cover">
      </div>

      <div class="flex flex-col">
        <h2 class="text-lg sm:text-[23px] font-serif font-bold text-white leading-none">Adviser Dashboard</h2>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="w-full max-w-[1400px] mx-auto flex flex-col md:flex-row gap-6 p-4 sm:p-6 min-h-screen pb-16">

    <!-- 1. KALIWANG CONTAINER (May solid na light background tulad sa screenshot) -->
    <div class="w-full min-w-0 md:flex-[2.5] bg-[#efefef] rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col border border-[#efefef] order-1 overflow-hidden">
      
      <!-- NAVIGATION TABS -->
      <nav class="sticky top-0 z-30 w-full bg-[#efefef] py-3 px-3 sm:px-6 border-b border-[#efefef] flex items-center justify-center gap-4 sm:gap-8 shadow-md rounded-t-2xl sm:rounded-t-3xl overflow-x-auto whitespace-nowrap [ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
  
  <!-- Candidate Management -->
  <a href="Adviser.html" class="flex items-center gap-1.5 sm:gap-2 text-gray-700 hover:text-black font-serif text-xs sm:text-base shrink-0 pb-1.5 pr-4 sm:pr-0"">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 sm:w-5 sm:h-5 text-[#8f0000] shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
    </svg>
    <span class="font-serif">Candidate Management</span>
  </a>

  <a href="elecmanagement.html" class="flex items-center gap-1.5 sm:gap-2 text-gray-700 hover:text-black font-serif text-xs sm:text-base shrink-0 pb-1.5 pr-4 sm:pr-0">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 sm:w-5 sm:h-5 text-[#8f0000] shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
    <span class="font-serif">Election Management</span>
  </a>

</nav>

      <!-- CONTENT BODY -->
      <div class="p-6 sm:p-8 space-y-6">
       

        <div class="flex items-center justify-between flex-wrap gap-3">
                    <h2 class="text-2xl font-bold font-serif-title tracking-wide">Election Control Panel</h2>


                    <div id="statusPill"
                        class="flex items-center gap-4 text-[#8f0000] px-4 py-2 text-xs sm:text-sm font-serif-title">
                        <span class="text-[#710000]">Status: <strong id="statusText">OPEN</strong></span>
                        <span class="opacity-50">|</span>
                        <span class="text-[#710000]">Names: <strong id="maskedText">Masked</strong></span>
                    </div>
                </div>


        <!-- Maroon Control Box -->
        <form id="electionTimeForm" onsubmit="handleStartElection(event)"
          class="bg-[#8f0000] p-6 sm:p-8 rounded-2xl shadow-xl text-white space-y-5">
          
          <!-- Set Starting Time -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <label for="startTime" class="flex items-center space-x-3 cursor-pointer">
              <i data-lucide="clock" class="w-5 h-5 text-white shrink-0"></i>
              <span class="font-serif text-white text-base sm:text-lg">Set Starting Time</span>
            </label>
            <input type="time" id="startTime" name="startTime" value="07:00" required
              class="bg-[#efefef] text-red-950 font-serif font-bold text-center px-4 py-2.5 rounded-lg w-full sm:w-64 outline-none focus:ring-2 focus:ring-amber-400 shadow cursor-pointer text-sm sm:text-base" />
          </div>

          <!-- Set Closing Time -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <label for="closingTime" class="flex items-center space-x-3 cursor-pointer">
              <i data-lucide="clock" class="w-5 h-5 text-white shrink-0"></i>
              <span class="font-serif text-white text-base sm:text-lg">Set Closing Time</span>
            </label>
            <input type="time" id="closingTime" name="closingTime" value="19:00" required
              class="bg-[#efefef] text-red-950 font-serif font-bold text-center px-4 py-2.5 rounded-lg w-full sm:w-64 outline-none focus:ring-2 focus:ring-amber-400 shadow cursor-pointer text-sm sm:text-base" />
          </div>

          <!-- Submit Button -->
          <div class="flex justify-end pt-2">
            <button type="submit"
              class="w-full sm:w-64 bg-[#efefef] hover:bg-gray-200 text-red-950 font-serif font-bold py-2.5 px-6 rounded-lg shadow-md hover:shadow-lg active:scale-95 transition text-center text-sm sm:text-base">
              Start the Election
            </button>
          </div>

        </form>

        <!-- 3 Quick Action Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 pt-2">
          
          <!-- Pause Election (Yellow) -->
          <button type="button" id="pauseBtn" onclick="handlePauseElection()"
            class="bg-[#f59e0b] hover:bg-amber-600 text-white p-6 rounded-2xl shadow-lg flex flex-col items-center text-center space-y-3 hover:scale-[1.02] active:scale-95 transition">
            <div class="w-12 h-12 rounded-full border-2 border-white flex items-center justify-center">
              <i data-lucide="pause" class="w-6 h-6 fill-white"></i>
            </div>
            <h3 class="font-serif text-lg sm:text-xl font-bold">Pause Election</h3>
            <p class="text-xs text-white/90">Temporarily stop accepting votes</p>
          </button>

          <!-- Stop Voting (Maroon) -->
          <button type="button" id="stopVotingBtn" onclick="handleStopVoting()"
            class="bg-[#8f0000] hover:bg-[#710000] text-white p-6 rounded-2xl shadow-lg flex flex-col items-center text-center space-y-3 hover:scale-[1.02] active:scale-95 transition">
            <div class="w-12 h-12 rounded-full border-2 border-white flex items-center justify-center">
              <i data-lucide="square" class="w-5 h-5 fill-white"></i>
            </div>
            <h3 class="font-serif text-lg sm:text-xl font-bold">Stop Voting</h3>
            <p class="text-xs text-white/90">Permanently end the election</p>
          </button>

          <!-- Mask the Name (Green) -->
          <button type="button" id="maskToggleBtn" onclick="handleMaskToggle()"
            class="bg-emerald-700 hover:bg-emerald-800 text-white p-6 rounded-2xl shadow-lg flex flex-col items-center text-center space-y-3 hover:scale-[1.02] active:scale-95 transition">
            <div class="w-12 h-12 rounded-full border-2 border-white flex items-center justify-center">
              <i id="maskIcon" data-lucide="eye-off" class="w-6 h-6"></i>
            </div>
            <h3 id="maskLabel" class="font-serif text-lg sm:text-xl font-bold">Mask the name</h3>
            <p class="text-xs text-white/90">Toggle candidate name visibility live</p>
          </button>

        </div>

      </div>

    </div>

    <!-- 2. KANANG CONTAINER (Live Results) -->
   <div class="w-full md:w-72 bg-[#efefef] rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 shadow-2xl shrink-0 flex flex-col border border-white/20 order-2 md:order-last md:sticky md:top-24 self-start">
  
  <div class="space-y-3 sm:space-y-4">
    <h3 class="text-[20px] sm:text-[25px] font-serif font-bold text-gray-950 mb-2 sm:mb-3">Live Results</h3>

    <!-- PRESIDENT -->
    <div class="position-section flex flex-col gap-1.5 w-full" data-position="President">
      <div class="pl-2.5">
        <h3 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">President</h3>
      </div>

      <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
        <!-- Candidate 1 -->
        <div class="candidate-row flex flex-col w-full" data-candidate-id="1">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-1">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-1" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>

        <!-- Candidate 2 -->
        <div class="candidate-row flex flex-col w-full" data-candidate-id="2">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-2">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-2" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- VICE-PRESIDENT -->
    <div class="position-section flex flex-col mt-2 gap-1.5 w-full" data-position="Vice-President">
      <div class="pl-2.5">
        <h3 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">Vice-President</h3>
      </div>

      <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
        <div class="candidate-row flex flex-col w-full" data-candidate-id="3">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-3">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-3" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>

        <div class="candidate-row flex flex-col w-full" data-candidate-id="4">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-4">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-4" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SECRETARY -->
    <div class="position-section mt-2 flex flex-col gap-1.5 w-full" data-position="Secretary">
      <div class="pl-2.5">
        <h3 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">Secretary</h3>
      </div>

      <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
        <div class="candidate-row flex flex-col w-full" data-candidate-id="5">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-5">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-5" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>

        <div class="candidate-row flex flex-col w-full" data-candidate-id="6">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-6">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-6" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>
        <div class="candidate-row flex flex-col w-full" data-candidate-id="6">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-6">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-6" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>
        <div class="candidate-row flex flex-col w-full" data-candidate-id="6">
          <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-gray-700 leading-none mb-0.5">
            <span id="percent-6">0%</span>
          </div>
          <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
            <div id="bar-6" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- STATUS FOOTER -->
  <div class="border-t border-gray-400 pt-3 sm:pt-4 mt-4">
    <h3 class="text-[15px] sm:text-[17px] font-serif font-bold text-gray-950 mb-1">Status</h3>
    <div class="flex justify-between text-[13px] sm:text-[15px] text-gray-800 font-medium py-0.5">
      <span>No.Voters:</span>
      <span id="No.voters" class="truncate max-w-[120px] text-right">Database not found</span>
    </div>
    <div class="flex justify-between text-[13px] sm:text-[15px] text-gray-800 font-medium py-0.5">
      <span>Voted :</span>
      <span id="Voted" class="truncate max-w-[120px] text-right">Database not found</span>
    </div>
    <div class="flex justify-between text-[13px] sm:text-[15px] text-gray-800 font-medium py-0.5">
      <span>No.Candidate:</span>
      <span id="No.candidates" class="truncate max-w-[120px] text-right">Database not found</span>
    </div>
  </div>
  

</div>

  </main>

  <script>
    const STORAGE_KEYS = {
      status: 'election_status',
      masked: 'names_masked'
    };

    function getElectionStatus() {
      return localStorage.getItem(STORAGE_KEYS.status) || 'OPEN';
    }

    function getNamesMasked() {
      const v = localStorage.getItem(STORAGE_KEYS.masked);
      return v === null ? true : v === 'true';
    }

    function setElectionStatus(status) {
      localStorage.setItem(STORAGE_KEYS.status, status);
      refreshStatusUI();
    }

    function setNamesMasked(masked) {
      localStorage.setItem(STORAGE_KEYS.masked, masked ? 'true' : 'false');
      refreshStatusUI();
    }

    function refreshStatusUI() {
      const status = getElectionStatus();
      const masked = getNamesMasked();

      document.getElementById('statusText').textContent = status;
      document.getElementById('maskedText').textContent = masked ? 'Masked' : 'Unmasked';

      const maskLabel = document.getElementById('maskLabel');
      if (masked) {
        maskLabel.textContent = 'Mask the name';
      } else {
        maskLabel.textContent = 'Unmask Names';
      }

      const stopBtn = document.getElementById('stopVotingBtn');
      if (status === 'CLOSED') {
        stopBtn.disabled = true;
        stopBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        stopBtn.disabled = false;
        stopBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }

      lucide.createIcons();
    }

    function handleStartElection(event) {
      event.preventDefault();
      const start = document.getElementById('startTime').value;
      const close = document.getElementById('closingTime').value;
      setElectionStatus('OPEN');
      alert(`Election Schedule Saved:\nStart: ${start}\nClose: ${close}`);
    }

    function handlePauseElection() {
      setElectionStatus('PAUSED');
    }

    function handleStopVoting() {
      if (getElectionStatus() === 'CLOSED') return;
      const confirmed = confirm(
        'This will permanently end the election and reveal candidate names on the Live Results page. Continue?'
      );
      if (!confirmed) return;
      setElectionStatus('CLOSED');
    }

    function handleMaskToggle() {
      setNamesMasked(!getNamesMasked());
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      refreshStatusUI();
    });
  </script>
</body>

</html>
