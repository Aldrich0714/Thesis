<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Election Management - MSEUF Election System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom style para sa native time/date picker icon */
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.2);
    }
  </style>
</head>

<body class="min-h-screen w-full bg-[#8f0000] text-[#efefef] font-sans antialiased flex flex-col overflow-y-auto">

  <!-- HEADER (Parehas na hitsura at layout) -->
  <header class="sticky top-0 z-50 w-full bg-[#8f0000] border-[#8f0000] py-5 px-3 flex items-center gap-3 shadow-md">
    <a href="Adviserlogin.html" class="text-white hover:opacity-80 transition">
     <svg xmlns="http://www.w3.org/2000/svg"width="40" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    </a>
    <div class="w-11 h-11 shrink-0 overflow-hidden rounded-full">
  <img src="image/logo.png" alt="User Profile" class="w-full h-full object-cover">
</div>
    <div class="flex flex-col">
      <h2 class="text-[23px] font-serif font-bold text-white leading-none">Adviser Dashboard</h2>
    </div>
  </header> 

  <!-- MAIN WRAPPER -->
  <main class="w-full max-w-[1400px] mx-auto flex flex-col md:flex-row gap-6 p-3  sm:p-6 min-h-screen pb-16">

    <!-- MAIN CONTENT CONTAINER (Election Management Control Panel) -->
    <div class=" w-full min-w-0 md:flex-[2.5] bg-[#efefef] rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col border border-[#efefef]/20 order-1">
      
      <!-- NAVIGATION TABS -->
      <nav class="sticky top-0 z-30 w-full bg-[#efefef] py-3 px-3 sm:px-6 border-b border-[#efefef] flex items-center justify-center gap-4 sm:gap-8 shadow-md rounded-t-2xl sm:rounded-t-3xl overflow-x-auto whitespace-nowrap [ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        <a href="Adviser.html" class="flex items-center gap-1.5 sm:gap-2 text-gray-700 hover:text-[#8f0000] font-serif text-xs sm:text-base shrink-0 pb-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
          </svg>
          <span class="font-serif">Candidate Management</span>
        </a>

        <a href="elecmanagement.html" class="flex items-center gap-1.5 sm:gap-2 text-[#8f0000] font-bold border-b-2 border-[#8f0000] font-serif text-xs sm:text-base shrink-0 pb-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 sm:w-5 sm:h-5 text-red-900 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          <span class="font-serif">Election Management</span>
        </a>
      </nav>

      <!-- CONTENT BODY -->
      <div class="p-4 sm:p-8 flex flex-col gap-6 w-full min-w-0">

        <!-- ELECTION SCHEDULE CONTROLS -->
        <div class="w-full">
          <h2 class="text-xl sm:text-2xl font-bold text-gray-950 mb-3 font-serif">Election Control Panel</h2>
          
          <div class="bg-gradient-to-r from-[#8f0000] to-[#710000] p-5 sm:p-7 rounded-2xl shadow-lg border border-red-950/20 text-white">
            <form id="electionTimeForm" onsubmit="handleStartElection(event)" class="flex flex-col gap-4">
              
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Start Time -->
                <div class="flex flex-col gap-1.5">
                  <label for="startTime" class="flex items-center gap-2 text-sm font-semibold font-serif text-[#efefef]">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>Set Starting Time:</span>
                  </label>
                  <input type="time" id="startTime" name="startTime" value="07:00" required
                    class="bg-[#efefef] text-gray-900 font-bold px-3 py-2 rounded-lg w-full outline-none focus:ring-2 focus:ring-amber-400 shadow-inner" />
                </div>

                <!-- Closing Time -->
                <div class="flex flex-col gap-1.5">
                  <label for="closingTime" class="flex items-center gap-2 text-sm font-semibold font-serif text-white/95">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>Set Closing Time:</span>
                  </label>
                  <input type="time" id="closingTime" name="closingTime" value="19:00" required
                    class="bg-[#efefef] text-gray-900 font-bold px-3 py-2 rounded-lg w-full outline-none focus:ring-2 focus:ring-amber-400 shadow-inner" />
                </div>
              </div>

              <div class="flex justify-end pt-2">
                <button type="submit"
                  class="w-full sm:w-auto bg-[#efefef] hover:bg-[#8f0000] text-[#8f0000] hover:text-[#efefef] font-serif font-bold py-2.5 px-8 rounded-lg shadow-md hover:shadow-lg active:scale-95 transition">
                  Start the Election
                </button>
              </div>

            </form>
          </div>
        </div>

        <!-- QUICK ACTION BUTTONS -->
        <div class="w-full">
          <h2 class="text-lg sm:text-xl font-bold text-gray-950 mb-3 font-serif">Quick Actions</h2>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            
            <!-- Pause Action -->
            <button type="button" class="bg-amber-600 hover:bg-amber-700 text-white p-5 rounded-2xl shadow-md border border-amber-500/40 flex flex-col items-center text-center gap-2 hover:scale-[1.02] active:scale-95 transition">
              <i data-lucide="pause-octagon" class="w-8 h-8"></i>
              <h3 class="font-serif text-base font-bold leading-tight">Pause Election</h3>
              <p class="text-xs text-white/90">Temporarily stop accepting votes</p>
            </button>

            <!-- Stop Action -->
            <button type="button" class="bg-[#8f0000] hover:bg-[#710000] text-[#efefef] p-5 rounded-2xl shadow-md border border-red-950/40 flex flex-col items-center text-center gap-2 hover:scale-[1.02] active:scale-95 transition">
              <i data-lucide="stop-circle" class="w-8 h-8"></i>
              <h3 class="font-serif text-base font-bold leading-tight">Stop Voting</h3>
              <p class="text-xs text-white/90">Permanently end the election</p>
            </button>

            <!-- Mask Name Action -->
            <button type="button" class="bg-emerald-700 hover:bg-emerald-800 text-white p-5 rounded-2xl shadow-md border border-emerald-600/40 flex flex-col items-center text-center gap-2 hover:scale-[1.02] active:scale-95 transition">
              <i data-lucide="eye-off" class="w-8 h-8"></i>
              <h3 class="font-serif text-base font-bold leading-tight">Mask the Name</h3>
              <p class="text-xs text-white/90">Hide candidate names on results</p>
            </button>

          </div>
        </div>

      </div>
    </div>

    <!-- SIDEBAR (Live Results & Status - Magkatugma sa Candidate Management) -->
    <div class="w-full md:w-72 bg-[#efefef] rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 shadow-2xl shrink-0 flex flex-col justify-between border border-[#efefef]/20 order-2 md:order-last">
      
      <div class="space-y-3 sm:space-y-4">
        <h3 class="text-[20px] sm:text-[25px] font-serif font-bold text-gray-950 mb-2 sm:mb-3">Live Results</h3>

        <!-- President -->
        <div class="position-section flex flex-col gap-1.5 w-full" data-position="President">
          <div class=" pl-2.5">
            <h3 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">President</h3>
          </div>
          <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
            <div class="candidate-row flex flex-col w-full" data-candidate-id="1">
              <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-[#8f0000] leading-none mb-0.5">
                <span id="percent-1">0%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div id="bar-1" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
              </div>
            </div>
            <div class="candidate-row flex flex-col w-full" data-candidate-id="2">
              <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-[#8f0000] leading-none mb-0.5">
                <span id="percent-2">0%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div id="bar-2" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Vice-President -->
        <div class="position-section flex flex-col gap-1.5 w-full" data-position="Vice-President">
          <div class=" pl-2.5">
            <h3 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">Vice-President</h3>
          </div>
          <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
            <div class="candidate-row flex flex-col w-full" data-candidate-id="3">
              <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-[#8f0000] leading-none mb-0.5">
                <span id="percent-3">0%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div id="bar-3" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
              </div>
            </div>
            <div class="candidate-row flex flex-col w-full" data-candidate-id="4">
              <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-[#8f0000] leading-none mb-0.5">
                <span id="percent-4">0%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div id="bar-4" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Secretary -->
        <div class="position-section flex flex-col gap-1.5 w-full" data-position="Secretary">
          <div class="pl-2.5">
            <h3 class="text-[18px] sm:text-[20px] font-serif font-bold text-gray-900 leading-tight">Secretary</h3>
          </div>
          <div class="candidates-list flex flex-col gap-2 pl-3 w-full">
            <div class="candidate-row flex flex-col w-full" data-candidate-id="5">
              <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-[#8f0000] leading-none mb-0.5">
                <span id="percent-5">0%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div id="bar-5" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
              </div>
            </div>
            <div class="candidate-row flex flex-col w-full" data-candidate-id="6">
              <div class="flex justify-end items-center text-xs sm:text-sm font-serif font-semibold text-[#8f0000] leading-none mb-0.5">
                <span id="percent-6">0%</span>
              </div>
              <div class="w-full bg-gray-400/60 h-3 sm:h-3.5 rounded-full overflow-hidden shadow-inner">
                <div id="bar-6" class="bg-[#8f0000] h-full rounded-full transition-all duration-500 ease-out w-0"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Status Footer -->
      <div class="border-t border-gray-400 pt-3 sm:pt-4 mt-4">
        <h3 class="text-[15px] sm:text-[17px] font-serif font-bold text-gray-950 mb-1">Status</h3>
        <div class="flex justify-between text-[13px] sm:text-[15px] text-gray-800 font-medium py-0.5">
          <span>No.Voters:</span>
          <span id="statusNoVoters" class="truncate max-w-[120px] text-[#8f0000] text-right">Database not found</span>
        </div>
        <div class="flex justify-between text-[13px] sm:text-[15px] text-gray-800 font-medium py-0.5">
          <span>Voted:</span>
          <span id="statusVoted" class="truncate max-w-[120px] text-[#8f0000] text-right">Database not found</span>
        </div>
        <div class="flex justify-between text-[13px] sm:text-[15px] text-gray-800 font-medium py-0.5">
          <span>No.Candidate:</span>
          <span id="statusNoCandidates" class="truncate max-w-[120px] text-[#8f0000] text-right">Database not found</span>
        </div>
      </div>

    </div>

  </main>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    function handleStartElection(event) {
      event.preventDefault();
      const start = document.getElementById('startTime').value;
      const close = document.getElementById('closingTime').value;
      alert(`Election Schedule Saved:\nStart: ${start}\nClose: ${close}`);
    }
  </script>
</body>

</html>
