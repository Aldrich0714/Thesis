<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Committee Dashboard MSEUF Election System</title>
  <link href="./dist/output.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen w-full bg-black text-gray-800 font-sans flex flex-col overflow-y-auto">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 w-full bg-[#8f0000] border-b border-red-900/50 py-5 px-3 flex items-center gap-3 shadow-md shrink-0">
    <a href="Committeelogin.html" class="text-white hover:opacity-80 transition shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"></path>
        <path d="M19 12H5"></path>
      </svg>
    </a>
    <div class="w-11 h-11 shrink-0 overflow-hidden rounded-full">
      <img src="image/logo.png" alt="User Profile" class="w-full h-full object-cover">
    </div>
    <div class="flex flex-col">
      <h2 class="text-[23px] font-serif font-bold text-white leading-none">Committee Dashboard</h2>
    </div>
  </header>

  <!-- MAIN WRAPPER (Nakakabit na dito ang image/bg.jpg) -->
  <main 
    class="relative flex-1 w-full bg-cover bg-center flex items-center justify-center p-6 md:p-12 pt-20 sm:pt-24 pb-16 overflow-hidden"
    style="background-image: url('image/bg.jpg');"
  >
    <!-- Background Overlay -->
    <div class="absolute inset-0 bg-[#8f0000]/20 bg-[#efefef]/30 pointer-events-none"></div>

    <!-- Watermark Logo -->
    <img 
      src="image/logo.png" 
      alt="Watermark Logo" 
      class="absolute left-6 md:left-16 top-40 -translate-y-1/2 w-72 md:w-[290px] opacity-20 pointer-events-none object-contain"
    />

    <!-- Main Card Container -->
    <div class="relative z-10 w-full max-w-6xl bg-[#8f0000] rounded-3xl p-8 md:p-14 shadow-2xl space-y-12 text-[#efefef]">

      <div class="flex flex-col md:flex-row items-center justify-between gap-10">
        
        <div class="space-y-4 max-w-lg w-full text-left">
          <div class="flex items-center space-x-4">
            <i data-lucide="camera" class="w-12 h-12 text-[#efefef] shrink-0"></i>
            <h2 class="text-3xl font-bold tracking-tight">Scan Physical Ballot</h2>
          </div>
          
          <p class="text-lg font-medium text-[#efefef]/90">Use the rear camera to scan the ballot.</p>
          
          <ul class="space-y-3 text-base pt-2">
            <li class="flex items-center space-x-3">
              <i data-lucide="check-circle-2" class="w-6 h-6 text-[#efefef]/90 shrink-0"></i>
              <span>Position ballot within frame</span>
            </li>
            <li class="flex items-center space-x-3">
              <i data-lucide="check-circle-2" class="w-6 h-6 text-[#efefef]/90 shrink-0"></i>
              <span>Ensure good lighting</span>
            </li>
            <li class="flex items-center space-x-3">
              <i data-lucide="check-circle-2" class="w-6 h-6 text-[#efefef]/90 shrink-0"></i>
              <span>Review and process captured image</span>
            </li>
          </ul>
        </div>

        <div class="w-48 h-60 bg-black/40 rounded-xl border-2 border-white/20 overflow-hidden shrink-0 relative shadow-xl">
          <img src="pic_ng_ballot_sample" alt="Ballot Preview" class="w-full h-full object-cover opacity-80" />
        </div>

        <div class="flex flex-col space-y-4 w-full md:w-56">
          <button class="bg-[#8f0000] hover:bg-[#710000] text-[#efefef] py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-lg transition active:scale-95">
            <i data-lucide="scan" class="w-6 h-6"></i>
            <span>Scan</span>
          </button>
          
          <button class="bg-[#8f0000] hover:bg-[#710000] text-[#efefef] py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-lg transition text-center leading-tight active:scale-95">
            <i data-lucide="upload" class="w-6 h-6 shrink-0"></i>
            <span>Upload Image</span>
          </button>
        </div>
      </div>

      <div class="flex flex-col md:flex-row items-center justify-between gap-10 pt-8 border-t-2 border-white/20">
        
        <div class="space-y-3 max-w-lg w-full">
          <div class="flex items-center space-x-4">
            <i data-lucide="file-signature" class="w-12 h-12 text-[#efefef] shrink-0"></i>
            <h2 class="text-3xl font-bold tracking-tight">Create Ballot</h2>
          </div>
          <p class="text-lg font-medium text-[#efefef]/90 pl-16">
            Review, edit, and generate ballot for printing.
          </p>
        </div>

        <div class="w-full md:w-56">
          <button class="w-full bg-[#800000] hover:bg-[#600000] text-[#efefef] py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-lg transition active:scale-95">
            <i data-lucide="file-search" class="w-6 h-6"></i>
            <span>Review</span>
          </button>
        </div>

      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
