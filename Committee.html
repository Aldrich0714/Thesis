<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Committee Dashboard MSEUF Election System</title>
  <link href="./dist/output.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen w-full bg-white/90 text-gray-800 font-sans flex flex-col overflow-y-auto">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 w-full bg-[#6a0000] border-b border-red-950/60 py-4 px-6 md:px-10 flex items-center justify-between shadow-md shrink-0">
      <div class="flex items-center gap-4">
        <a href="Committeelogin.html" class="text-white hover:opacity-80 transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </a>

        <div class="w-12 h-12 shrink-0">
          <img src="image/logo.png" alt="User Profile" class="w-full h-full object-cover">
        </div>
        <h2 class="text-xl md:text-2xl font-serif font-bold text-white leading-none">Committee Dashboard</h2>
      </div>

      <a href="livedashboard.html" class="bg-black/30 hover:bg-black/50 text-white text-base px-6 py-3 rounded-full border border-white/10 flex items-center gap-2 shadow transition shrink-0">
        <span>Live Dash Board</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
      </a>
    </header>

    <!-- MAIN: Inayos para sa Desktop Screen (max-w-6xl) -->
    <main class="w-full max-w-6xl mx-auto p-6 md:p-12 pb-16 flex-1 flex items-center justify-center">
        
        <!-- CARD CONTAINER: Malapad, Maayos ang Spacing -->
        <div class="w-full bg-gradient-to-r from-[#b32424] to-[#d93838] rounded-3xl p-8 md:p-14 shadow-2xl space-y-12 text-white">

            <!-- FIRST SECTION: Scan Ballot -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-10">
                
                <!-- Instructions Area -->
                <div class="space-y-4 max-w-lg w-full text-left">
                    <div class="flex items-center space-x-4">
                        <i data-lucide="camera" class="w-12 h-12 text-white shrink-0"></i>
                        <h2 class="text-3xl font-bold tracking-tight">Scan Physical Ballot</h2>
                    </div>
                    
                    <p class="text-lg font-medium text-white/90">Use the rear camera to scan the ballot.</p>
                    
                    <ul class="space-y-3 text-base pt-2">
                        <li class="flex items-center space-x-3">
                            <i data-lucide="check-circle-2" class="w-6 h-6 text-white/90 shrink-0"></i>
                            <span>Position ballot within frame</span>
                        </li>
                        <li class="flex items-center space-x-3">
                            <i data-lucide="check-circle-2" class="w-6 h-6 text-white/90 shrink-0"></i>
                            <span>Ensure good lighting</span>
                        </li>
                        <li class="flex items-center space-x-3">
                            <i data-lucide="check-circle-2" class="w-6 h-6 text-white/90 shrink-0"></i>
                            <span>Review and process captured image</span>
                        </li>
                    </ul>
                </div>

                <!-- Ballot Preview Box -->
                <div class="w-48 h-60 bg-black/40 rounded-xl border-2 border-white/20 overflow-hidden flex-shrink-0 relative shadow-xl">
                    <img src="pic_ng_ballot_sample" alt="Ballot Preview" class="w-full h-full object-cover opacity-80" />
                </div>

                <!-- Buttons Area -->
                <div class="flex flex-col space-y-4 w-full md:w-56">
                    <button class="bg-[#800000] hover:bg-[#600000] text-white py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-lg transition active:scale-95">
                        <i data-lucide="scan" class="w-6 h-6"></i>
                        <span>Scan</span>
                    </button>
                    
                    <button class="bg-[#800000] hover:bg-[#600000] text-white py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-lg transition text-center leading-tight active:scale-95">
                        <i data-lucide="upload" class="w-6 h-6 flex-shrink-0"></i>
                        <span>Upload Image</span>
                    </button>
                </div>
            </div>

            <!-- SECOND SECTION: Create Ballot -->
            <div class="flex flex-col md:flex-row items-center justify-between gap-10 pt-8 border-t-2 border-white/20">
                
                <div class="space-y-3 max-w-lg w-full">
                    <div class="flex items-center space-x-4">
                        <i data-lucide="file-signature" class="w-12 h-12 text-white shrink-0"></i>
                        <h2 class="text-3xl font-bold tracking-tight">Create Ballot</h2>
                    </div>
                    <p class="text-lg font-medium text-white/90 pl-16">
                        Review, edit, and generate ballot for printing.
                    </p>
                </div>

                <!-- Review Button -->
                <div class="w-full md:w-56">
                    <button class="w-full bg-[#800000] hover:bg-[#600000] text-white py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 font-bold text-lg shadow-lg transition active:scale-95">
                        <i data-lucide="file-search" class="w-6 h-6"></i>
                        <span>Review</span>
                    </button>
                </div>

            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
